name: Build Windows portable app

on:
  push:
    branches: ["**"]
    paths:
      - "windows-app/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "windows-app/**"
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows-app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows-app/requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build BackupSuite.exe
        run: |
          pyinstaller --noconfirm --clean `
            --distpath windows-app/dist `
            --workpath windows-app/work `
            windows-app/build/BackupSuite.spec

      - name: Assemble folder 0
        run: |
          New-Item -ItemType Directory -Force -Path 0/Data, 0/Apps, 0/Projects, 0/Shortcuts | Out-Null
          Copy-Item windows-app/dist/BackupSuite.exe 0/ -Force
          Copy-Item docs/QUICKSTART-fa.txt 0/ -Force
          # Keep the empty folders in the zip so the layout survives extraction.
          foreach ($d in @("Data","Apps","Projects","Shortcuts")) {
            New-Item -ItemType File -Force -Path "0/$d/.keep" | Out-Null
          }
          Compress-Archive -Path 0 -DestinationPath BackupSuite-portable.zip -Force
          Get-Item BackupSuite-portable.zip | Select-Object Name, Length

      - name: Smoke-test the executable
        run: |
          # The app is windowed, so we only verify the binary exists and is
          # large enough to contain the bundled interpreter.
          $exe = Get-Item windows-app/dist/BackupSuite.exe
          if ($exe.Length -lt 5MB) { throw "BackupSuite.exe looks too small ($($exe.Length) bytes)" }
          Write-Host "BackupSuite.exe: $([math]::Round($exe.Length / 1MB, 1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: BackupSuite-portable
          path: BackupSuite-portable.zip
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: BackupSuite-portable.zip
